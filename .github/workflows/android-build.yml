name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # v3 defaults to the removed "tools" package → fails with
      # "Failed to find package 'tools'". v4 drops it.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK, CMake, platform & build-tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "ndk;28.0.12674087" \
            "cmake;3.22.1" \
            "platforms;android-36" \
            "build-tools;36.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.12674087" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.0.12674087" >> $GITHUB_ENV

      - name: Ensure llama.cpp is present
        run: |
          if [ ! -d "app/src/main/cpp/third_party/llama.cpp" ]; then
            echo "Fetching llama.cpp (pinned)…"
            mkdir -p app/src/main/cpp/third_party
            git clone --depth 1 --branch master https://github.com/ggml-org/llama.cpp.git app/src/main/cpp/third_party/llama.cpp
            cd app/src/main/cpp/third_party/llama.cpp
            git rev-parse HEAD
          fi

      - name: Grant execute permission for gradlew
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.10.2
          fi
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
